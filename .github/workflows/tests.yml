name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # LibreOffice is needed for report/build_docx.js's PDF conversion
      # step (see backend/worker.py's build_pdf()). It's known to be broken
      # in the Claude Code dev sandbox this project was built in (fails on
      # ANY file, not just ours — see tests/test_e2e_pipeline.py's
      # docstring) but should work normally in a standard Ubuntu CI runner.
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install report/ npm dependencies
        run: cd report && npm ci

      - name: Run tests
        run: pytest -v
