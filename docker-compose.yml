services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - repas_data:/app/backend/_data
    environment:
      - QUEUE_DB_PATH=/app/backend/_data/queue.db

  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    env_file:
      - .env
    volumes:
      - repas_data:/app/backend/_data
    environment:
      - QUEUE_DB_PATH=/app/backend/_data/queue.db
    depends_on:
      - backend

volumes:
  repas_data:
